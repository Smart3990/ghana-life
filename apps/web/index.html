<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#0E7A3E" />

          <li><span class="lang">Twi</span><span class="phrase" lang="tw">Yɛma wo akwaaba! Wo ho te sɛn?</span></li>
          <li><span class="lang">Fante</span><span class="phrase" lang="fat">Yɛma wo akwaaba! Ɛte dɛn?</span></li>
          <li><span class="lang">English</span><span class="phrase">We welcome you! How are you?</span></li>

        <p class="loading">Bringing you to Accra…</p>
      </div>
      <div class="kente" aria-hidden="true"></div>
