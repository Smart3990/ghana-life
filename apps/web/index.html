<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E7A3E" />
    <title>Ghana Life · test build</title>
  </head>
  <body>
    <div id="map"></div>

    <!-- Shared drawing patterns: kente stripes for the player's shirt -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <linearGradient id="kente-shirt" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#e8b10d" /><stop offset="0.34" stop-color="#e8b10d" />
          <stop offset="0.34" stop-color="#0e7a3e" /><stop offset="0.52" stop-color="#0e7a3e" />
          <stop offset="0.52" stop-color="#c8102e" /><stop offset="0.7" stop-color="#c8102e" />
          <stop offset="0.7" stop-color="#111111" /><stop offset="0.76" stop-color="#111111" />
          <stop offset="0.76" stop-color="#e8b10d" /><stop offset="1" stop-color="#e8b10d" />
        </linearGradient>
      </defs>
    </svg>

    <header class="hud" hidden>
      <span class="brand">Akwaaba</span>
      <span id="place">Black Star Square, Accra</span>
      <span id="online"></span>
      <span id="debug" hidden></span>
    </header>

    <p id="toast" role="status" hidden></p>

    <section id="splash" aria-label="Welcome">
      <div class="kente" aria-hidden="true"></div>
      <div class="splash-body">
        <h1>Akwaaba</h1>
        <ul class="greetings">
          <li><span class="lang">Twi</span><span class="phrase" lang="tw">Yɛma wo akwaaba! Wo ho te sɛn?</span></li>
          <li><span class="lang">Fante</span><span class="phrase" lang="fat">Yɛma wo akwaaba! Ɛte dɛn?</span></li>
          <li><span class="lang">English</span><span class="phrase">We welcome you! How are you?</span></li>
        </ul>
        <p class="loading">Bringing you to Accra…</p>
      </div>
      <div class="kente" aria-hidden="true"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
